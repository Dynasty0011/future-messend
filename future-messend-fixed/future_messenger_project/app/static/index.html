<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Future Messenger</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #111827; color: #e5e7eb; }
    header { padding: 16px 20px; border-bottom: 1px solid #374151; display:flex; justify-content:space-between; align-items:center; }
    main { display:grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 68px); }
    .panel { border-right: 1px solid #374151; padding: 16px; overflow:auto; }
    .chat { display:flex; flex-direction:column; padding:16px; gap:12px; }
    .card { background:#1f2937; border:1px solid #374151; border-radius:14px; padding:12px; margin-bottom:12px; }
    input, button, textarea { width:100%; box-sizing:border-box; border-radius:10px; border:1px solid #4b5563; background:#111827; color:#e5e7eb; padding:10px 12px; margin:6px 0; }
    button { background:#2563eb; border:none; cursor:pointer; }
    button.secondary { background:#374151; }
    .row { display:flex; gap:8px; }
    .row > * { flex:1; }
    .muted { color:#9ca3af; font-size: 14px; }
    .list-item { padding:10px; border-radius:10px; cursor:pointer; border:1px solid transparent; }
    .list-item.active { border-color:#60a5fa; background:#1d4ed8; }
    #messages { flex:1; overflow:auto; display:flex; flex-direction:column; gap:8px; }
    .msg { padding:10px 12px; border-radius:12px; background:#1f2937; border:1px solid #374151; }
    .msg.me { background:#0f172a; }
  </style>
</head>
<body>
  <header>
    <div><strong>Future Messenger</strong> <span class="muted">рабочая сборка</span></div>
    <div id="status" class="muted">offline</div>
  </header>
  <main>
    <aside class="panel">
      <div class="card" id="authCard">
        <h3>Вход / регистрация</h3>
        <input id="email" type="email" placeholder="email" />
        <input id="password" type="password" placeholder="пароль" />
        <input id="displayName" type="text" placeholder="имя" />
        <div class="row">
          <button id="registerBtn">Регистрация</button>
          <button id="loginBtn" class="secondary">Войти</button>
        </div>
        <button id="logoutBtn" class="secondary">Выйти</button>
      </div>
      <div class="card">
        <h3>Новый чат</h3>
        <input id="convTitle" placeholder="Название чата" />
        <input id="peerId" placeholder="ID собеседника" />
        <button id="createConvBtn">Создать</button>
      </div>
      <div class="card">
        <h3>Чаты</h3>
        <div id="convList"></div>
      </div>
    </aside>
    <section class="chat">
      <div class="card">
        <div id="currentConvTitle" style="font-weight:700">Чат не выбран</div>
        <div id="currentConvMeta" class="muted"></div>
      </div>
      <div id="messages"></div>
      <div class="card">
        <textarea id="messageText" rows="3" placeholder="Сообщение"></textarea>
        <button id="sendBtn">Отправить</button>
      </div>
    </section>
  </main>
  <script>
    let csrfToken = '';
    let currentUser = null;
    let currentConv = null;
    let ws = null;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

    async function api(path, opts = {}) {
      const headers = opts.headers || {};
      if (!['GET', 'HEAD', 'OPTIONS'].includes((opts.method || 'GET').toUpperCase()) && csrfToken) {
        headers['x-csrf-token'] = csrfToken;
      }
      if (opts.body && !(opts.body instanceof FormData)) headers['content-type'] = 'application/json';
      const res = await fetch(path, { credentials: 'include', ...opts, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
      return data;
    }

    function setStatus(text) { $('status').textContent = text; }

    function renderMessages(messages) {
      const box = $('messages');
      box.innerHTML = '';
      for (const m of messages) {
        const el = document.createElement('div');
        el.className = 'msg' + (currentUser && m.sender_id === currentUser.id ? ' me' : '');
        el.innerHTML = `<div class="muted">#${m.id} • ${esc(m.created_at)}</div><div>${esc(m.ciphertext)}</div>`;
        box.appendChild(el);
      }
      box.scrollTop = box.scrollHeight;
    }

    async function loadBootstrap() {
      const data = await api('/api/bootstrap');
      currentUser = data.user;
      csrfToken = data.csrf_token || '';
      $('authCard').style.opacity = currentUser ? '0.75' : '1';
      setStatus(currentUser ? `online: ${currentUser.display_name}` : 'offline');
      if (currentUser) await loadConversations();
    }

    async function loadConversations() {
      const data = await api('/api/conversations');
      const list = $('convList');
      list.innerHTML = '';
      for (const c of data.conversations) {
        const item = document.createElement('div');
        item.className = 'list-item' + (currentConv && currentConv.id === c.id ? ' active' : '');
        item.innerHTML = `<div><strong>${esc(c.title)}</strong></div><div class="muted">ID ${c.id} · ${esc(c.type)}</div>`;
        item.onclick = () => selectConversation(c);
        list.appendChild(item);
      }
    }

    async function selectConversation(c) {
      currentConv = c;
      $('currentConvTitle').textContent = c.title;
      $('currentConvMeta').textContent = `ID ${c.id} • ${c.type}`;
      await loadMessages();
      if (ws) ws.close();
      ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/conversations/${c.id}`);
      ws.onmessage = async (ev) => {
        const data = JSON.parse(ev.data);
        if (data.type === 'message') await loadMessages();
      };
    }

    async function loadMessages() {
      if (!currentConv) return;
      const data = await api(`/api/conversations/${currentConv.id}/messages`);
      renderMessages(data.messages);
    }

    $('registerBtn').onclick = async () => {
      try {
        const body = { email: $('email').value, password: $('password').value, display_name: $('displayName').value || $('email').value.split('@')[0] };
        const data = await api('/api/auth/register', { method: 'POST', body: JSON.stringify(body) });
        currentUser = data.user;
        csrfToken = (await api('/api/auth/me')).csrf_token;
        await loadConversations();
        setStatus(`online: ${currentUser.display_name}`);
      } catch (e) { alert(e.message); }
    };

    $('loginBtn').onclick = async () => {
      try {
        const body = { email: $('email').value, password: $('password').value };
        const data = await api('/api/auth/login', { method: 'POST', body: JSON.stringify(body) });
        currentUser = data.user;
        csrfToken = (await api('/api/auth/me')).csrf_token;
        await loadConversations();
        setStatus(`online: ${currentUser.display_name}`);
      } catch (e) { alert(e.message); }
    };

    $('logoutBtn').onclick = async () => {
      try { await api('/api/auth/logout', { method: 'POST' }); location.reload(); } catch (e) { alert(e.message); }
    };

    $('createConvBtn').onclick = async () => {
      try {
        const body = { title: $('convTitle').value || 'Новый чат', direct_peer_id: $('peerId').value ? Number($('peerId').value) : null };
        await api('/api/conversations', { method: 'POST', body: JSON.stringify(body) });
        await loadConversations();
      } catch (e) { alert(e.message); }
    };

    $('sendBtn').onclick = async () => {
      try {
        if (!currentConv) return alert('Сначала выберите чат');
        const text = $('messageText').value.trim();
        if (!text) return;
        await api(`/api/conversations/${currentConv.id}/messages`, { method: 'POST', body: JSON.stringify({ ciphertext: text, envelope: {} }) });
        $('messageText').value = '';
        await loadMessages();
      } catch (e) { alert(e.message); }
    };

    loadBootstrap().catch(err => setStatus(err.message));
  </script>
</body>
</html>
